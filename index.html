<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--card:#162624;--fg:#e4efec;--mut:#93aaa4;--acc:#4fb8a8;--on:#06201c;--br:#d9a548;--ok:#5fd394;--okbg:#14382a;--bad:#ff8a80;--badbg:#411d1b;--line:#2a403c}}
:root[data-theme="dark"]{--bg:#0e1a18;--card:#162624;--fg:#e4efec;--mut:#93aaa4;--acc:#4fb8a8;--on:#06201c;--br:#d9a548;--ok:#5fd394;--okbg:#14382a;--bad:#ff8a80;--badbg:#411d1b;--line:#2a403c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 6px}
h2{font:600 20px/1.4 Georgia,"Times New Roman",serif;margin:16px 0}
p{margin:0 0 14px;color:var(--mut)}
.btn{display:block;width:100%;text-align:left;padding:14px 16px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn small{display:block;color:var(--mut);font-size:14px}
.btn.main{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn.main small{color:inherit;opacity:.85}
button:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:15px}
.top svg{flex:none}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:0 0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad b{background:var(--bad);border-color:var(--bad);color:var(--card)}
.fb{margin:14px 0;padding:12px 14px;border-left:4px solid var(--br);background:var(--card);border-radius:0 10px 10px 0}
.fb strong{display:block}
.score{font:700 56px/1 Georgia,serif;color:var(--acc);margin:12px 0 4px}
.wr{padding:12px 0;border-top:1px solid var(--line)}
.wr p{margin:4px 0 0;font-size:15px}
.wr .a{color:var(--ok)}
.wr .b{color:var(--bad)}
@media(prefers-reduced-motion:no-preference){.btn,.opt{transition:border-color .15s,background .15s}}
</style></head>

<button class="btn" data-a="0" data-b="13">Khái niệm và cấu trúc văn hóa<small>Câu 1-14</small></button>
<button class="btn" data-a="14" data-b="15">Vùng văn hóa<small>Câu 15-16</small></button>
<button class="btn" data-a="16" data-b="34">Tiến trình lịch sử văn hóa<small>Câu 17-35</small></button>`;
app.querySelectorAll("button").forEach(b=>b.onclick=()=>{const d=b.dataset;
if(d.m)go([...Q.keys()],d.m==="r");else go(Array.from({length:d.b-d.a+1},(_,k)=>+d.a+k),false)})}
function go(ids,shuf){L=ids;if(shuf)L.sort(()=>Math.random()-.5);i=0;sc=0;wr=[];live=true;show()}
function ring(p){return `<svg viewBox="0 0 44 44" width="48" height="48" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(p*113.1).toFixed(1)} 113.1" transform="rotate(-90 22 22)"/></svg>`}
function show(){if(i>=L.length)return end();const n=L[i],q=Q[n];done=false;
app.innerHTML=`<div class="top">${ring(i/L.length)}<span>Câu ${i+1}/${L.length}, đúng ${sc}</span></div><h2>${q[0]}</h2>
${q[1].map((t,k)=>`<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b><span>${t}</span></button>`).join("")}<div id="fb"></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));window.scrollTo(0,0)}
function pick(k){if(done||!live)return;done=true;const n=L[i],q=Q[n],ok=k===q[2],o=app.querySelectorAll(".opt");
o.forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add("ok");else if(j===k)b.classList.add("bad")});
if(ok)sc++;else wr.push([n,k]);
$("#fb").innerHTML=`<div class="fb"><strong>${ok?"Đúng":"Chưa đúng, đáp án là "+"ABCD"[q[2]]}</strong>${q[3]}</div><button class="btn main" id="nx">${i+1<L.length?"Câu tiếp":"Xem kết quả"}</button>`;
$("#nx").onclick=next;$("#nx").focus()}
function next(){if(!done)return;i++;show()}
function end(){live=false;const pc=Math.round(sc/L.length*100);
app.innerHTML=`<h1>Kết quả</h1><div class="score">${sc}/${L.length}</div><p>${pc}% câu đúng.${wr.length?" Xem lại các câu sai bên dưới.":" Bạn làm đúng tất cả."}</p>
${wr.length?`<button class="btn main" id="rw">Làm lại ${wr.length} câu sai</button>`:""}
<button class="btn" id="ra">Làm lại từ đầu</button><button class="btn" id="hm">Về trang chọn bài</button>
${wr.map(([n,k])=>`<div class="wr"><strong>Câu ${n+1}. ${Q[n][0]}</strong><p class="b">Bạn chọn: ${"ABCD"[k]}. ${Q[n][1][k]}</p><p class="a">Đáp án: ${"ABCD"[Q[n][2]]}. ${Q[n][1][Q[n][2]]}</p></div>`).join("")}`;
const w=wr.map(x=>x[0]),all=L.slice();
if(wr.length)$("#rw").onclick=()=>go(w,true);$("#ra").onclick=()=>go(all,false);$("#hm").onclick=home;window.scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(!live)return;const k="abcd1234".indexOf(e.key.toLowerCase());
if(k>=0&&!done&&k%4<Q[L[i]][1].length)pick(k%4);else if(done&&(e.key==="ArrowRight"))next()});
home();
</script></body></html>
